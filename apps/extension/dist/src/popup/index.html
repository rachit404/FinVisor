<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinVisor</title>
    <script type="module" crossorigin src="/assets/popup.js"></script>
  </head>

  <body>
    <h1>FinVisor</h1>

    <div id="status">Loading stock context...</div>

    <div id="stock-context"></div>

    <hr />

    <div>
      <label for="question">Ask about this stock</label>

      <textarea
        id="question"
        rows="4"
        placeholder="Ask a question about this stock..."
      ></textarea>

      <br />

      <button id="ask-button" type="button">Ask</button>
    </div>

    <div id="answer"></div>

  </body>
</html>
